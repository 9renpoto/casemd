name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hugo.yml
      - README.md
      - docs/**
      - website/**
  pull_request:
    paths:
      - .github/workflows/hugo.yml
      - README.md
      - docs/**
      - website/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hugo
        env:
          HUGO_VERSION: 0.166.0
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "$RUNNER_TEMP/hugo"
          tar --extract --file "$RUNNER_TEMP/hugo.tar.gz" --directory "$RUNNER_TEMP/hugo"
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build documentation site
        run: hugo --source website --gc --minify

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hugo
        env:
          HUGO_VERSION: 0.166.0
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "$RUNNER_TEMP/hugo"
          tar --extract --file "$RUNNER_TEMP/hugo.tar.gz" --directory "$RUNNER_TEMP/hugo"
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build documentation site
        run: hugo --source website --gc --minify

      - name: Publish generated site to gh-pages
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "PAGES_DEPLOY_TOKEN must be configured before publishing."
            exit 1
          fi
          publish_dir="$RUNNER_TEMP/gh-pages"
          remote_url="https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote_url" gh-pages > /dev/null; then
            git clone --branch gh-pages --single-branch "$remote_url" "$publish_dir"
          else
            git init "$publish_dir"
            git -C "$publish_dir" checkout --orphan gh-pages
            git -C "$publish_dir" remote add origin "$remote_url"
          fi
          find "$publish_dir" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -a website/public/. "$publish_dir"
          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "No documentation-site changes to publish."
            exit 0
          fi
          git -C "$publish_dir" commit --message "Deploy documentation site"
          git -C "$publish_dir" push origin gh-pages
