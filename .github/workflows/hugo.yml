name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hugo.yml
      - README.md
      - docs/**
      - website/**
  pull_request:
    paths:
      - .github/workflows/hugo.yml
      - README.md
      - docs/**
      - website/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo
        env:
          HUGO_VERSION: 0.166.0
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "$RUNNER_TEMP/hugo"
          tar --extract --file "$RUNNER_TEMP/hugo.tar.gz" --directory "$RUNNER_TEMP/hugo"
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build documentation site
        run: hugo --source website --gc --minify

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: website/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
