name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Verify module files
        run: go mod tidy

      - name: Check formatting
        run: |
          mapfile -t files < <(find . -name '*.go' -not -path './.devcontainer/*')
          if ((${#files[@]})); then
            unformatted=$(gofmt -l "${files[@]}")
            if [ -n "$unformatted" ]; then
              echo "Go files need formatting:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

      - name: Build CLI
        run: go build ./cmd/casemd

      - name: Generate Web UI scenario workbook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./casemd --input scenarios/web-ui.md --spreadsheet-output build/web-ui-scenarios.xlsx

      - name: Upload Web UI scenario workbook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui-scenarios
          path: build/web-ui-scenarios.xlsx
          if-no-files-found: error

  octocov:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - name: Run octocov
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          version: v0.83.3
          checksum: 8d6576580d151e785474f193d740f63cb91b70ac767d402410fcd7f187a34202

      - name: Upload coverage badge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: build/coverage.svg
          if-no-files-found: error

  pages:
    needs: octocov
    permissions:
      contents: read
      pages: write
      id-token: write
    # Keep the local call syntax supported by actionlint.
    uses: ./.github/workflows/hugo.yml # zizmor: ignore[self-repository]
