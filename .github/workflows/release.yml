name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag matches CHANGELOG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          changelog_version="$(sed -nE 's/^## v([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CHANGELOG.md | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$version" != "$changelog_version" ]]; then
            echo "The first CHANGELOG entry must be formatted as ## vX.Y.Z (YYYY-MM-DD)." >&2
            exit 1
          fi

          release_notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            BEGIN { heading = "## v" version " (" }
            index($0, heading) == 1 { found = 1 }
            found && $0 ~ /^## v/ && index($0, heading) != 1 { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$release_notes"
          if [[ ! -s "$release_notes" ]]; then
            echo "Could not extract release notes for v$version from CHANGELOG.md." >&2
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=$release_notes" >> "$GITHUB_ENV"

      - name: Verify release targets are publishable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $GITHUB_REF_NAME. Push tags only; GoReleaser publishes the release and its assets." >&2
            exit 1
          fi
          if [[ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN must grant contents:write access to 9renpoto/homebrew-tap." >&2
            exit 1
          fi
          if ! GH_TOKEN="$HOMEBREW_TAP_GITHUB_TOKEN" gh api \
            --method POST \
            repos/9renpoto/homebrew-tap/git/blobs \
            -f content="casemd release preflight ${GITHUB_RUN_ID}" \
            -f encoding=utf-8 \
            --silent; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN must grant contents:write access to 9renpoto/homebrew-tap." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Publish release archives and Homebrew cask
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes "${{ env.RELEASE_NOTES_FILE }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
